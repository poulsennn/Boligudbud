name: Daglig Boligopdatering

on:
  schedule:
    # 06:00 UTC svarer til kl. 08:00 dansk sommertid (07:00 UTC om vinteren)
    - cron: '0 6 * * *'
  workflow_dispatch: # Gør det muligt at starte kørslen manuelt

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository data
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer afhængigheder
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kør boligscript
        run: python bolig_opdatering.py

      - name: Gem opdateret historikfil i GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add huse_hvidovre_historik.json
          git commit -m "Auto-opdatering af bolighistorik [skip ci]" || exit 0
          git push
